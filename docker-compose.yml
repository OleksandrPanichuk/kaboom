name: ${APP_SLUG:-kaboom}

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
      - APP_NAME=${APP_NAME:-Kaboom}
      - APP_SLUG=${APP_SLUG:-kaboom}
      - SESSIONS_REDIS_URL=redis://sessions:6379
      - JOBS_REDIS_URL=redis://queue_redis:6379
      - CACHE_REDIS_URL=redis://cache:6379
      - SMTP_URL=smtp://mailpit:1025
      - STORAGE_S3_ENDPOINT=http://storage:9000
      - STORAGE_S3_BUCKET=${APP_SLUG:-kaboom}
      - STORAGE_S3_ACCESS_KEY_ID=storageadmin
      - STORAGE_S3_SECRET_ACCESS_KEY=storageadmin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      sessions:
        condition: service_healthy
      queue_redis:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/typescript-config:/app/packages/typescript-config
      - ./packages/design:/app/packages/design
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/design/node_modules
    networks:
      - main_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      - API_URL=http://api:8080
      - VITE_USE_POLLING=true
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./apps/api:/app/apps/api:ro
      - ./packages/api-client:/app/packages/api-client
      - ./packages/design:/app/packages/design
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/api/node_modules
      - /app/packages/api-client/node_modules
      - /app/packages/design/node_modules
    networks:
      - main_network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - main_network

  storage:
    image: rustfs/rustfs:latest
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/${APP_SLUG:-kaboom} && exec /entrypoint.sh rustfs
    environment:
      - RUSTFS_ACCESS_KEY=storageadmin
      - RUSTFS_SECRET_KEY=storageadmin
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - main_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 1
  sessions:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6380:6379"
    volumes:
      - sessions_data:/data
    networks:
      - main_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  queue_redis:
    image: redis:8.10-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - queue_redis_data:/data
    networks:
      - main_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6381:6379"
    networks:
      - main_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  bull_board:
    image: ghcr.io/felixmosh/bull-board
    profiles:
      - bull_board
    environment:
      - BULL_BOARD_REDIS_URL=redis://queue_redis:6379
    ports:
      - "3001:3000"
    depends_on:
      queue_redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - main_network

  drizzle_studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    profiles:
      - drizzle_studio
    command:
      - bunx
      - --bun
      - drizzle-kit
      - studio
      - --host
      - 0.0.0.0
      - --port
      - "4983"
    environment:
      - NODE_ENV=development
      - APP_NAME=${APP_NAME:-Kaboom}
      - APP_SLUG=${APP_SLUG:-kaboom}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
    ports:
      - "4983:4983"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    networks:
      - main_network

volumes:
  postgres_data:
  rustfs_data:
  sessions_data:
  queue_redis_data:

networks:
  main_network:
    driver: bridge
