# Services for the test suite, kept apart from the development stack: different
# containers, different ports, no volumes. Nothing here persists, so a run
# always starts from an empty state and can never touch development data.
#
#   make test              Postgres only — what the suite needs by default
#   make test-integration  adds the services the real adapters talk to
#   make test-down         removes it all

name: ${APP_SLUG:-kaboom}-test

services:
  db_test:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  sessions_test:
    image: redis:8.10-alpine
    profiles: [integration]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6480:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  cache_test:
    image: redis:8.10-alpine
    profiles: [integration]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6481:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  queue_test:
    image: redis:8.10-alpine
    profiles: [integration]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit_test:
    image: axllent/mailpit:latest
    profiles: [integration]
    ports:
      - "1125:1025"
      - "8125:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  storage_test:
    image: rustfs/rustfs:latest
    profiles: [integration]
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/test-bucket && exec /entrypoint.sh rustfs
    environment:
      - RUSTFS_ACCESS_KEY=storageadmin
      - RUSTFS_SECRET_KEY=storageadmin
    tmpfs:
      - /data:mode=1777
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 15
