name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate API client
        run: bun run generate

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start the services the real adapters talk to
        run: docker compose -f docker-compose.test.yml --profile integration up -d --wait

      - name: Test
        env:
          TEST_SESSIONS_REDIS_URL: redis://localhost:6480
          TEST_CACHE_REDIS_URL: redis://localhost:6481
          TEST_RATE_LIMIT_REDIS_URL: redis://localhost:6480
          TEST_JOBS_REDIS_URL: redis://localhost:6479
          TEST_SMTP_URL: smtp://localhost:1125
          TEST_MAILPIT_URL: http://localhost:8125
          TEST_S3_ENDPOINT: http://localhost:9100
          TEST_S3_BUCKET: test-bucket
          TEST_S3_ACCESS_KEY_ID: storageadmin
          TEST_S3_SECRET_ACCESS_KEY: storageadmin
        run: bun run test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate API client and routes
        run: bun run generate

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test:e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
